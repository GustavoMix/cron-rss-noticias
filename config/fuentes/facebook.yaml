# Páginas públicas de Facebook.
#
# ATENCIÓN antes de agregar fuentes acá: cada página cuesta cupo de IP.
# Facebook deja pasar ~2 páginas públicas por IP antes de cortar, y el
# planificador arma un job de CI (= una IP) cada `facebook.tamano_grupo`
# fuentes. Con tamaño 2, esta lista se traduce directo en jobs paralelos:
#
#     jobs = ceil(cantidad_de_fuentes / 2)
#
# `facebook.max_paralelo` es el tope de grupos que genera el planificador.
# Con las 80 páginas actuales y tamaño 2 se necesitan 40 grupos. En el workflow,
# `max-parallel: 16` controla cuántos de esos grupos corren simultáneamente; los
# demás quedan en cola sin agrandar los grupos.
#
# `orden_preferido` (opcional, menor = más temprano) solo desempata cuando dos
# fuentes tienen la misma urgencia histórica; la prioridad real la decide la
# rotación en datos/_interno/rotacion_facebook.json.

fuentes:
