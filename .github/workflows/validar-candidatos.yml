name: Validar feeds candidatos (temporal)
on:
  push:
    branches: [ccr-5618be0c-yuya1m]
    paths: ["herramientas/candidatos.txt", "herramientas/validar_candidatos.py", ".github/workflows/validar-candidatos.yml"]
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx==0.28.1 feedparser==6.0.11
      - run: python herramientas/validar_candidatos.py herramientas/candidatos.txt
